<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>적정가 범위 계산하기</title>
<style>
  :root {
    --bg: #ffffff; --bg-soft: #f3f5f7; --card: #ffffff; --text: #141a21; --muted: #5a6673;
    --line: #dfe4ea; --accent: #0f766e; --accent-soft: #e0f2f0; --accent-text: #ffffff; --warn: #b42318;
    --shadow: 0 1px 2px rgba(20,26,33,.04), 0 8px 24px rgba(20,26,33,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f151b; --bg-soft: #161e26; --card: #1a242e; --text: #f0f3f6; --muted: #a4afba;
      --line: #2b3844; --accent: #4fd1c5; --accent-soft: #143a37; --accent-text: #08201d; --warn: #ff8a80;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg-soft); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.6; word-break: keep-all; overflow-wrap: break-word;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  .topbar { padding: 18px 0; background: var(--bg); border-bottom: 1px solid var(--line); }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; }
  .brand { font-weight: 800; letter-spacing: -0.02em; }
  a { color: var(--accent); font-weight: 700; text-decoration: none; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  main { padding: 40px 0 72px; }
  h1 { font-size: clamp(26px, 6vw, 38px); line-height: 1.25; margin: 0 0 8px; letter-spacing: -0.03em; }
  h2 { font-size: 20px; margin: 0 0 12px; letter-spacing: -0.02em; }
  .lead { color: var(--muted); margin: 0 0 28px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px; }
  .stock-row { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; background: var(--bg-soft); }
  .row-title { margin: 0 0 8px; font-size: 13px; font-weight: 800; color: var(--muted); }
  .grid5 { display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr); }
  @media (min-width: 760px) { .grid5 { grid-template-columns: 1.2fr 1fr 1fr 1fr 1fr; } }
  .grid3 { display: grid; gap: 10px; grid-template-columns: repeat(3, 1fr); }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); font-family: inherit; font-size: 16px; }
  .example-pick { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 0 0 10px; }
  .example-pick label { font-size: 12px; font-weight: 700; color: var(--muted); }
  .example-pick select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); font-family: inherit; font-size: 14px; min-height: 40px; }
  .example-note { flex-basis: 100%; margin: 0; font-size: 12px; color: var(--muted); }
  .example-missing { margin: 0 0 12px; padding: 10px 14px; border-radius: 12px; background: var(--bg-soft); color: var(--muted); font-size: 13px; font-weight: 700; }
  .field input.invalid { border-color: var(--warn); border-width: 2px; }
  .err { color: var(--warn); font-size: 12px; font-weight: 700; margin: 4px 0 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 36px; border: 0; border-radius: 16px; background: var(--accent); color: var(--accent-text); font-size: 18px; font-weight: 800; cursor: pointer; font-family: inherit; }
  .status { color: var(--warn); font-weight: 700; margin: 14px 0 0; min-height: 1.6em; }
  .small { font-size: 13px; color: var(--muted); }
  .notice { border-radius: 14px; background: var(--accent-soft); padding: 14px 18px; font-size: 14px; margin: 16px 0 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 10px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { font-size: 13px; color: var(--muted); font-weight: 700; }
  td.c-base { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  td.c-gap { color: var(--muted); font-weight: 700; }
  @media (max-width: 640px) {
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tr { border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; margin-bottom: 12px; }
    td { border: 0; padding: 4px 0; display: flex; justify-content: space-between; gap: 12px; text-align: right; }
    td::before { content: attr(data-label); color: var(--muted); font-size: 13px; font-weight: 600; text-align: left; }
    td.c-base { font-size: 22px; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="topbar"><div class="wrap">
  <span class="brand">적정가 범위 계산기</span>
  <a href="index.html">소개로 돌아가기</a>
</div></div>

<main><div class="wrap">
  <h1>가정은 한 번만 넣어요</h1>
  <p class="lead">종목 값과 목표 PER을 넣으면 종목마다 단기·중기·장기 적정가 범위가 나와요. 값은 직접 만든 예시여도 괜찮아요.</p>

  <form id="calcForm" novalidate>
    <div class="card">
      <h2>1. 종목 (최대 5줄, 쓰지 않는 줄은 비워 두세요)</h2>
      <p id="exampleMsg" class="example-missing" hidden></p>
      <div id="rows"></div>
    </div>

    <div class="card">
      <h2>2. 공통 목표 PER (배)</h2>
      <div class="grid3">
        <div class="field"><label for="per-low">비관</label><input id="per-low" type="text" inputmode="decimal" autocomplete="off" placeholder="예: 8" aria-describedby="err-per-low"><p class="err" id="err-per-low" hidden></p></div>
        <div class="field"><label for="per-base">기준</label><input id="per-base" type="text" inputmode="decimal" autocomplete="off" placeholder="예: 10" aria-describedby="err-per-base"><p class="err" id="err-per-base" hidden></p></div>
        <div class="field"><label for="per-high">낙관</label><input id="per-high" type="text" inputmode="decimal" autocomplete="off" placeholder="예: 12" aria-describedby="err-per-high"><p class="err" id="err-per-high" hidden></p></div>
      </div>
      <p class="small" style="margin:12px 0 0">목표 PER은 내가 정하는 가정이에요. 이 도구가 대신 정해 주지 않아요.</p>
    </div>

    <button id="calcBtn" class="btn" type="submit">계산하기</button>
    <p id="status" class="status" role="alert" aria-live="polite"></p>
  </form>

  <section id="result" class="card" hidden aria-live="polite">
    <h2 id="resultTitle"></h2>
    <table>
      <thead><tr><th>종목</th><th>기간</th><th>적정가 범위 (비관 ~ 낙관)</th><th>기준 적정가</th><th>현재가 대비</th></tr></thead>
      <tbody id="resultBody"></tbody>
    </table>
    <p id="rateLine" class="small" style="margin-top:16px"></p>
    <p id="disclaimer" class="notice"></p>
  </section>

  <p class="small">수업 과제 데모 · 투자 판단 근거 아님. 예시 값은 실제 종목이 아니에요.</p>
</div></main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
