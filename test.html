<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단위 테스트 (UT)</title>
<style>
  body { font-family: system-ui, "Malgun Gothic", sans-serif; margin: 24px; line-height: 1.5; color: #141a21; }
  h1 { font-size: 22px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border: 1px solid #dfe4ea; padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: #f3f5f7; }
  .pass { color: #0a7a3d; font-weight: 800; }
  .fail { color: #b42318; font-weight: 800; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
  #summary { font-size: 18px; font-weight: 800; margin: 12px 0; }
</style>
</head>
<body>
<h1>단위 테스트 (UT) — app.js 함수에 값을 넣어 본다 (v2: 최근 EPS 1개 + 기본 시나리오)</h1>
<p>기대 결과는 <code>docs/requirements.md</code>(v2)·<code>docs/qa_scenarios.md</code>에서 가져와 이 파일에 적었고, <b>화면에 보이는 형식(쉼표·기호)과 문장까지 똑같은지</b> 비교합니다. 통과 여부는 「실제」와 「기대」를 눈으로 대조하세요.</p>
<div id="summary"></div>
<table>
  <thead><tr><th>테스트 ID</th><th>R-ID</th><th>무엇을 확인하나</th><th>기대</th><th>실제</th><th>판정</th></tr></thead>
  <tbody id="out"></tbody>
</table>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
  var A = FairApp;
  var DEF = { per: { low: 8, base: 10, high: 12 }, growth: [-10, 0, 10] };
  var ASSUMP_OK = { "per-low": "8", "per-base": "10", "per-high": "12", "g-0": "-10", "g-1": "0", "g-2": "10" };
  function assump(over) { var a = {}; for (var k in ASSUMP_OK) a[k] = ASSUMP_OK[k]; for (var k2 in over) a[k2] = over[k2]; return a; }
  function emptyRows() { var r = []; for (var i = 0; i < 5; i++) r.push({ name: "", price: "", eps: "" }); return r; }
  // 예시A 한 줄(현재가 60,000 · 최근 EPS 4,500)에서 필요한 칸만 바꿔 넣은 5줄 입력
  function rowA(over) {
    var r = emptyRows(); var b = { price: "60,000", eps: "4,500" };
    for (var k in over) b[k] = over[k];
    r[0] = { name: "예시A", price: b.price, eps: b.eps };
    return r;
  }
  var TOP_EMPTY = "빈 칸이 있어 계산하지 않았습니다. 표시된 칸을 채워 주세요.";
  var TOP_INVALID = "입력값을 확인해 주세요. 표시된 칸을 고친 뒤 다시 계산해 주세요.";

  // 기대값은 requirements.md v2에서 가져온 문자열이다(app.js로 계산하지 않는다).
  var EXPECT_A = [
    { stock: "예시A", period: "단기", range: "32,400 ~ 48,600", base: "40,500", gap: "-32.5%" },
    { stock: "예시A", period: "중기", range: "36,000 ~ 54,000", base: "45,000", gap: "-25.0%" },
    { stock: "예시A", period: "장기", range: "39,600 ~ 59,400", base: "49,500", gap: "-17.5%" }
  ];
  var EXPECT_B = [
    { stock: "예시B", period: "단기", range: "15,840 ~ 23,760", base: "19,800", gap: "-34.0%" },
    { stock: "예시B", period: "중기", range: "17,600 ~ 26,400", base: "22,000", gap: "-26.7%" },
    { stock: "예시B", period: "장기", range: "19,360 ~ 29,040", base: "24,200", gap: "-19.3%" }
  ];
  var EXPECT_C = [
    { stock: "예시C", period: "단기", range: "46,080 ~ 69,120", base: "57,600", gap: "-32.2%" },
    { stock: "예시C", period: "중기", range: "51,200 ~ 76,800", base: "64,000", gap: "-24.7%" },
    { stock: "예시C", period: "장기", range: "56,320 ~ 84,480", base: "70,400", gap: "-17.2%" }
  ];
  var EXPECT_A_G20 = [EXPECT_A[0], { stock: "예시A", period: "중기", range: "43,200 ~ 64,800", base: "54,000", gap: "-10.0%" }, EXPECT_A[2]];
  var EXPECT_RATE = { month: "2026-08", long: 4.286, short: 2.97 };
  var EXPECT_RATE_LINE = "참고: 한국 장기금리(10년 국채) 4.286 %, 3개월 금리 2.97 % (2026-08, 출처: OECD Data Explorer, CC BY 4.0). 종목의 적정 배수를 알려 주는 값이 아닙니다.";
  var EXPECT_DISCLAIMER = "주가 예측이 아니라 입력한 가정에 따른 시나리오이며, 종목 추천이나 매수·매도 권유가 아닙니다.";
  var EXPECT_EXAMPLE_MISSING = "예시 종목을 불러오지 못했습니다. 값을 직접 입력해 주세요.";

  var tests = [
    // ── R-01 정상 ──
    { id: "UT-01a", r: "R-01", what: "예시A 계산 (현재가 60000, 최근 EPS 4500, 기본 가정)", expected: EXPECT_A,
      run: function () { return A.buildDisplayRows(A.calcAll([{ name: "예시A", price: 60000, eps: 4500 }], DEF)); } },
    { id: "UT-01b", r: "R-01", what: "예시B 계산 (현재가 30000, 최근 EPS 2200, 기본 가정)", expected: EXPECT_B,
      run: function () { return A.buildDisplayRows(A.calcAll([{ name: "예시B", price: 30000, eps: 2200 }], DEF)); } },
    { id: "UT-01c", r: "R-01", what: "금리 참고: data.js 마지막 행", expected: EXPECT_RATE,
      run: function () { return A.getRateReference(window.KOR_RATES_MONTHLY); } },
    { id: "UT-01d", r: "R-01", what: "금리 참고 줄 문장(화면에 나오는 문장 그대로)", expected: EXPECT_RATE_LINE,
      run: function () { return A.formatRateLine(A.getRateReference(window.KOR_RATES_MONTHLY)); } },
    { id: "UT-01e", r: "R-01", what: "면책 문구(화면에 나오는 문장 그대로)", expected: EXPECT_DISCLAIMER,
      run: function () { return A.DISCLAIMER; } },
    { id: "UT-01f", r: "R-01", what: "예상 EPS = 최근 EPS × (1+증감률): (4500,-10) (4500,0) (4500,10) (2200,10)", expected: [4050, 4500, 4950, 2420],
      run: function () { return [A.calcExpectedEps(4500, -10), A.calcExpectedEps(4500, 0), A.calcExpectedEps(4500, 10), A.calcExpectedEps(2200, 10)]; } },

    // ── R-02 빈값 ──
    { id: "UT-02a", r: "R-02", what: "종목 줄 5개가 모두 비어 있음", expected: { ok: false, top: "종목 정보를 한 줄 이상 입력해 주세요.", errors: [] },
      run: function () { return A.validateInputs(emptyRows(), assump({})); } },
    { id: "UT-02b", r: "R-02", what: "현재가만 빔", expected: { ok: false, top: TOP_EMPTY, errors: [{ id: "f-0-price", message: "현재가를 입력해 주세요." }] },
      run: function () { return A.validateInputs(rowA({ price: "" }), assump({})); } },
    { id: "UT-02c", r: "R-02", what: "최근 EPS만 빔", expected: { ok: false, top: TOP_EMPTY, errors: [{ id: "f-0-eps", message: "최근 EPS를 입력해 주세요." }] },
      run: function () { return A.validateInputs(rowA({ eps: "" }), assump({})); } },
    { id: "UT-02d", r: "R-02", what: "기준 PER만 빔", expected: { ok: false, top: TOP_EMPTY, errors: [{ id: "per-base", message: "기준 목표 PER을 입력해 주세요." }] },
      run: function () { return A.validateInputs(rowA({}), assump({ "per-base": "" })); } },
    { id: "UT-02e", r: "R-02", what: "중기 증감률만 빔", expected: { ok: false, top: TOP_EMPTY, errors: [{ id: "g-1", message: "중기 증감률을 입력해 주세요." }] },
      run: function () { return A.validateInputs(rowA({}), assump({ "g-1": "" })); } },
    { id: "UT-02f", r: "R-02", what: "모든 칸이 채워지면 빈값 오류 없음 (R-01 입력)", expected: { ok: true, top: "", errors: [] },
      run: function () {
        var r = emptyRows(); r[0] = { name: "예시A", price: "60,000", eps: "4,500" }; r[1] = { name: "예시B", price: "30,000", eps: "2,200" };
        return A.validateInputs(r, assump({}));
      } },

    // ── R-03 오류 ──
    { id: "UT-03a", r: "R-03", what: "현재가에 문자 「abc」", expected: { ok: false, top: TOP_INVALID, errors: [{ id: "f-0-price", message: "숫자만 입력해 주세요. (예: 60000)" }] },
      run: function () { return A.validateInputs(rowA({ price: "abc" }), assump({})); } },
    { id: "UT-03b1", r: "R-03", what: "현재가 0", expected: { ok: false, top: TOP_INVALID, errors: [{ id: "f-0-price", message: "현재가는 0보다 큰 숫자여야 합니다." }] },
      run: function () { return A.validateInputs(rowA({ price: "0" }), assump({})); } },
    { id: "UT-03b2", r: "R-03", what: "최근 EPS -100", expected: { ok: false, top: TOP_INVALID, errors: [{ id: "f-0-eps", message: "최근 EPS는 0보다 큰 숫자여야 합니다." }] },
      run: function () { return A.validateInputs(rowA({ eps: "-100" }), assump({})); } },
    { id: "UT-03b3", r: "R-03", what: "기준 PER 0", expected: { ok: false, top: TOP_INVALID, errors: [{ id: "per-base", message: "목표 PER은 0보다 큰 숫자여야 합니다." }] },
      run: function () { return A.validateInputs(rowA({}), assump({ "per-base": "0" })); } },
    { id: "UT-03c", r: "R-03", what: "PER 순서 (비관 12 · 기준 10 · 낙관 8)", expected: { ok: false, top: TOP_INVALID, errors: [{ id: "per-high", message: "목표 PER은 비관 ≤ 기준 ≤ 낙관 순서로 입력해 주세요." }] },
      run: function () { return A.validateInputs(rowA({}), assump({ "per-low": "12", "per-base": "10", "per-high": "8" })); } },
    { id: "UT-03d", r: "R-03", what: "쉼표 숫자 「60,000」은 60000으로 읽는다", expected: 60000,
      run: function () { return A.parseNumber("60,000"); } },
    { id: "UT-03e", r: "R-03", what: "쉼표 숫자를 넣어도 오류 없음 (현재가 「60,000」)", expected: { ok: true, top: "", errors: [] },
      run: function () { return A.validateInputs(rowA({}), assump({})); } },
    { id: "UT-03f", r: "R-03", what: "빈 칸과 잘못된 값이 함께 있을 때 (현재가 「abc」 + 최근 EPS 빔) — 상단은 빈 칸 문구 우선, 칸 아래는 각각",
      expected: { ok: false, top: TOP_EMPTY, errors: [{ id: "f-0-price", message: "숫자만 입력해 주세요. (예: 60000)" }, { id: "f-0-eps", message: "최근 EPS를 입력해 주세요." }] },
      run: function () { return A.validateInputs(rowA({ price: "abc", eps: "" }), assump({})); } },
    { id: "UT-03g", r: "R-03", what: "단기 증감률 「abc」", expected: { ok: false, top: TOP_INVALID, errors: [{ id: "g-0", message: "증감률은 숫자로 입력해 주세요. (예: -10, 0, 10)" }] },
      run: function () { return A.validateInputs(rowA({}), assump({ "g-0": "abc" })); } },
    { id: "UT-03h", r: "R-03", what: "단기 증감률 -100", expected: { ok: false, top: TOP_INVALID, errors: [{ id: "g-0", message: "증감률은 -100보다 큰 숫자여야 합니다." }] },
      run: function () { return A.validateInputs(rowA({}), assump({ "g-0": "-100" })); } },
    { id: "UT-03i", r: "R-03", what: "증감률 -10(음수)은 정상 (기본 가정)", expected: { ok: true, top: "", errors: [] },
      run: function () { return A.validateInputs(rowA({}), assump({})); } },

    // ── R-04 데이터 없음 ──
    { id: "UT-04a", r: "R-04", what: "getRateReference(undefined) — data.js를 못 불러온 경우", expected: null,
      run: function () { return A.getRateReference(undefined); } },
    { id: "UT-04b", r: "R-04", what: "getRateReference({rows: []}) — rows가 비어 있는 경우", expected: null,
      run: function () { return A.getRateReference({ rows: [] }); } },
    { id: "UT-04c", r: "R-04", what: "금리 자료가 없을 때 화면에 나오는 문장 그대로", expected: "금리 자료를 불러오지 못했습니다. 계산은 그대로 사용할 수 있습니다.",
      run: function () { return A.formatRateLine(A.getRateReference(undefined)); } },
    { id: "UT-04d", r: "R-04", what: "금리 자료가 없어도 계산 결과는 R-01과 같다 (예시A)", expected: EXPECT_A,
      run: function () { return A.buildDisplayRows(A.calcAll([{ name: "예시A", price: 60000, eps: 4500 }], DEF)); } },

    // ── R-05 예시 종목 선택 ── (가상 종목)
    { id: "UT-05a", r: "R-05", what: "applyExample(\"예시A\") — data.js의 가상 종목을 이름으로 찾기", expected: { name: "예시A", price: 60000, eps: 4500 },
      run: function () { return A.applyExample("예시A"); } },
    { id: "UT-05b", r: "R-05", what: "예시C를 고른 값으로 계산 (기본 가정)", expected: EXPECT_C,
      run: function () { return A.buildDisplayRows(A.calcAll([A.applyExample("예시C")], DEF)); } },
    { id: "UT-05c1", r: "R-05", what: "applyExample(\"직접 입력\") — 칸 값을 바꾸지 않는다", expected: null,
      run: function () { return A.applyExample("직접 입력"); } },
    { id: "UT-05c2", r: "R-05", what: "applyExample(\"없는종목\") — 목록에 없는 이름", expected: null,
      run: function () { return A.applyExample("없는종목"); } },
    { id: "UT-05d", r: "R-05", what: "예시 종목 5개의 이름 (예시A~E, 가상)", expected: ["예시A", "예시B", "예시C", "예시D", "예시E"],
      run: function () { return A.getExampleList(window.EXAMPLE_STOCKS).map(function (s) { return s.name; }); } },

    // ── R-06 예시 목록 없음 ──
    { id: "UT-06a", r: "R-06", what: "getExampleList(undefined)와 ([]) — 예시 데이터가 없거나 비어 있음", expected: [[], []],
      run: function () { return [A.getExampleList(undefined), A.getExampleList([])]; } },
    { id: "UT-06b", r: "R-06", what: "getExampleMessage — undefined · [] · 현재 목록", expected: [EXPECT_EXAMPLE_MISSING, EXPECT_EXAMPLE_MISSING, ""],
      run: function () { return [A.getExampleMessage(undefined), A.getExampleMessage([]), A.getExampleMessage(window.EXAMPLE_STOCKS)]; } },

    // ── R-07 기본 시나리오 ──
    { id: "UT-07a", r: "R-07", what: "getDefaults() — 미리 채우는 값", expected: { per: { low: 8, base: 10, high: 12 }, growth: [-10, 0, 10] },
      run: function () { return A.getDefaults(); } },
    { id: "UT-07b", r: "R-07", what: "중기 증감률을 20으로 고치면 예시A 중기가 바뀐다 (증감률 -10·20·10)", expected: EXPECT_A_G20,
      run: function () { return A.buildDisplayRows(A.calcAll([{ name: "예시A", price: 60000, eps: 4500 }], { per: { low: 8, base: 10, high: 12 }, growth: [-10, 20, 10] })); } },
    { id: "UT-07c", r: "R-07", what: "기본 시나리오 안내 문구(화면에 나오는 문장 그대로)", expected: "미리 채운 값(목표 PER 8·10·12, 이익 증감률 -10·0·+10 %)은 임의의 기본 시나리오이며 예측이나 추천이 아니에요. 자유롭게 고쳐 쓰세요.",
      run: function () { return A.MSG_DEFAULTS_NOTE; } }
  ];

  var tbody = document.getElementById("out");
  var pass = 0;
  tests.forEach(function (t) {
    var actual, error = null;
    try { actual = t.run(); } catch (e) { error = String(e); actual = "오류: " + error; }
    var ok = !error && JSON.stringify(actual) === JSON.stringify(t.expected);
    if (ok) pass++;
    var tr = document.createElement("tr");
    function cell(html) { var td = document.createElement("td"); td.innerHTML = html; tr.appendChild(td); }
    function esc(v) { return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
    function show(v) { return "<pre>" + esc(typeof v === "string" ? v : JSON.stringify(v, null, 1)) + "</pre>"; }
    cell(t.id); cell(t.r); cell(esc(t.what)); cell(show(t.expected)); cell(show(actual));
    cell(ok ? '<span class="pass">통과</span>' : '<span class="fail">실패</span>');
    tbody.appendChild(tr);
  });
  document.getElementById("summary").textContent = "통과 " + pass + " / 전체 " + tests.length + (pass === tests.length ? "" : " — 실패가 있어요");
</script>
</body>
</html>
